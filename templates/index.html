<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VALKYRIE C-UAV Turret Command Center</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        :root {
            --bg-base: #090d16;
            --bg-card: #111827;
            --border-color: #1f2937;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, monospace;
            margin: 0;
            padding: 10px;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            gap: 8px;
        }

        h1 {
            color: #60a5fa;
            font-size: 1.05rem;
            margin: 0;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .telemetry-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 0.75rem;
        }

        .badge {
            background: #1f2937;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #374151;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .badge span {
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        @media (max-width: 840px) {
            .grid { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: bold;
            padding: 0 4px;
        }

        .video-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: crosshair;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: auto;
            pointer-events: none;
        }

        /* Click/Tap Target Indicator Ripple */
        .tap-marker {
            position: absolute;
            width: 36px;
            height: 36px;
            border: 2px solid var(--accent-cyan);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(1.4);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.25s ease-out, opacity 0.25s ease-out;
            box-shadow: 0 0 12px var(--accent-cyan);
        }

        .tap-marker.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .controls-panel {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        @media (max-width: 640px) {
            .controls-panel { grid-template-columns: repeat(2, 1fr); }
        }

        button {
            background: #1f2937;
            border: 1px solid #374151;
            color: var(--text-main);
            font-weight: 700;
            padding: 12px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.12s ease;
            text-transform: uppercase;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-height: 52px; /* Touch target size for mobile */
        }

        button:active { transform: scale(0.97); }

        button.active {
            background: var(--accent-blue);
            border-color: #60a5fa;
            color: #fff;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }

        button.danger {
            background: #7f1d1d;
            border-color: var(--accent-red);
            color: #fca5a5;
        }

        button.danger.active {
            background: var(--accent-red);
            color: #fff;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
        }

        button.warning {
            background: #78350f;
            border-color: var(--accent-amber);
            color: #fde68a;
        }

        button.warning.active {
            background: var(--accent-amber);
            color: #000;
        }

        /* Keyboard Hotkey Badges */
        kbd {
            display: none; /* Default hidden on touch/mobile devices */
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            padding: 1px 5px;
            font-size: 0.65rem;
            font-family: monospace;
            color: var(--accent-cyan);
            letter-spacing: 0.5px;
        }

        /* Only show hotkey badges when hovered with desktop mouse/pointer */
        @media (hover: hover) and (pointer: fine) {
            kbd {
                display: inline-block;
            }
        }

        .logs-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
        }

        .logs-header {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        #logs {
            background: #030712;
            border: 1px solid #111827;
            height: 100px;
            overflow-y: auto;
            padding: 8px;
            font-size: 0.75rem;
            border-radius: 4px;
            color: #34d399;
            line-height: 1.4;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ VALKYRIE C-UAV TURRET</h1>
        <div class="telemetry-badges">
            <div class="badge">ARM: <span id="st-arm" style="color: #ef4444;">DISARMED</span></div>
            <div class="badge">AIM: <span id="st-aim" style="color: #60a5fa;">RGB</span></div>
            <div class="badge">CHAMBER: <span id="st-ammo" style="color: #10b981;">LOADED</span></div>
            <div class="badge">SHOTS: <span id="st-shots">0</span></div>
        </div>
    </header>

    <div class="grid">
        <!-- RGB Camera Card -->
        <div class="card">
            <div class="card-header">
                <span>SENSOR 02: OPTICAL RGB</span>
                <span id="rgb-status" style="color: var(--accent-green);">● LIVE</span>
            </div>
            <div class="video-container" id="container-rgb" onclick="handleTapTarget(event, 'rgb')">
                <img src="/video_feed/rgb" alt="Optical RGB Stream">
                <div id="tap-rgb" class="tap-marker"></div>
            </div>
        </div>

        <!-- IR Thermal Card -->
        <div class="card">
            <div class="card-header">
                <span>SENSOR 01: THERMAL IR</span>
                <span id="ir-status" style="color: var(--text-muted);">● STANDBY</span>
            </div>
            <div class="video-container" id="container-ir" onclick="handleTapTarget(event, 'ir')">
                <img src="/video_feed/ir" alt="Thermal IR Stream">
                <div id="tap-ir" class="tap-marker"></div>
            </div>
        </div>
    </div>

    <!-- Control Actions Panel with Keyboard Hotkey Badges -->
    <div class="controls-panel">
        <button id="btn-arm" class="danger" onclick="sendAction('arm')">
            <span>SAFETY ARM</span>
            <kbd>[A]</kbd>
        </button>
        <button id="btn-fire" class="danger" onclick="sendAction('fire')">
            <span>FIRE!</span>
            <kbd>[SPACE]</kbd>
        </button>
        <button id="btn-auto" onclick="sendAction('auto')">
            <span>AUTO-SHOOT</span>
            <kbd>[S]</kbd>
        </button>
        <button id="btn-reload" class="warning" onclick="sendAction('reload')">
            <span>RELOAD</span>
            <kbd>[R]</kbd>
        </button>
        <button id="btn-areload" onclick="sendAction('areload')">
            <span>AUTO-RELOAD</span>
            <kbd>[E]</kbd>
        </button>
        <button id="btn-aim" onclick="sendAction('aim')">
            <span>SWITCH AIM</span>
            <kbd>[TAB]</kbd>
        </button>
        <button onclick="sendAction('release')">
            <span>RELEASE LOCKS</span>
            <kbd>[ESC]</kbd>
        </button>
        <button onclick="clearLogs()" style="background: #374151;">
            <span>CLEAR LOGS</span>
            <kbd>[C]</kbd>
        </button>
    </div>

    <!-- Live Terminal Logs -->
    <div class="logs-card">
        <div class="logs-header">
            <span>LIVE SYSTEM TERMINAL</span>
            <span style="color: var(--accent-green);">STATUS: ONLINE</span>
        </div>
        <div id="logs"></div>
    </div>

    <script>
        const socket = io();

        function sendAction(act) {
            socket.emit('control_action', { action: act });
        }

        // Keyboard Controls Listener for PC / Laptop
        window.addEventListener('keydown', (e) => {
            // Ignore keystrokes if focused inside an input or editable field
            if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

            const key = e.key.toLowerCase();
            let action = null;

            if (key === 'a') action = 'arm';
            else if (e.code === 'Space') { action = 'fire'; e.preventDefault(); }
            else if (key === 's') action = 'auto';
            else if (key === 'r') action = 'reload';
            else if (key === 'e') action = 'areload';
            else if (e.key === 'Tab') { action = 'aim'; e.preventDefault(); }
            else if (e.key === 'Escape') action = 'release';
            else if (key === 'c') clearLogs();

            if (action) {
                sendAction(action);
            }
        });

        // Click-to-Lock / Tap-to-Lock Handler
        function handleTapTarget(event, sensorKey) {
            const container = document.getElementById(`container-${sensorKey}`);
            const rect = container.getBoundingClientRect();
            
            // Calculate relative coordinates (0.0 to 1.0)
            const clickX = event.clientX - rect.left;
            const clickY = event.clientY - rect.top;
            const normX = clickX / rect.width;
            const normY = clickY / rect.height;

            // Trigger visual feedback marker at click position
            const marker = document.getElementById(`tap-${sensorKey}`);
            if (marker) {
                marker.style.left = `${clickX}px`;
                marker.style.top = `${clickY}px`;
                marker.classList.add('active');
                setTimeout(() => marker.classList.remove('active'), 400);
            }

            // Emit targeting request to backend API
            socket.emit('tap_target', {
                sensor: sensorKey,
                x: normX,
                y: normY
            });
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }

        socket.on('log_event', data => {
            const l = document.getElementById('logs');
            l.innerHTML += `<div>${data.message}</div>`;
            l.scrollTop = l.scrollHeight;
        });

        socket.on('telemetry_update', data => {
            const armBtn = document.getElementById('btn-arm');
            const stArm = document.getElementById('st-arm');
            if (data.armed) {
                armBtn.classList.add('active');
                stArm.innerText = "ARMED";
                stArm.style.color = "#ef4444";
            } else {
                armBtn.classList.remove('active');
                stArm.innerText = "DISARMED";
                stArm.style.color = "#9ca3af";
            }

            document.getElementById('st-ammo').innerText = data.ammo;
            document.getElementById('st-aim').innerText = data.aim_sensor;
            document.getElementById('st-shots').innerText = data.shots;

            document.getElementById('btn-auto').classList.toggle('active', data.auto_shoot);
            document.getElementById('btn-areload').classList.toggle('active', data.auto_reload);
        });
    </script>
</body>
</html>
